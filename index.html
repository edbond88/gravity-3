<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The three-body problem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&family=Unbounded:wght@700;800&family=Onest:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sim"></canvas>
  <p class="no-webgl" data-i18n="webgl.missing" hidden></p>

  <div class="overlay">
    <header>
      <h1 data-i18n-html="title"></h1>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="label" data-i18n="stat.time"></div>
        <div class="value"><span id="time">0</span><span class="unit" id="time-unit"></span></div>
        <div class="drift" data-i18n-title="stat.energy.title"><span data-i18n="stat.energy"></span> <b id="energy">0</b></div>
      </div>
      <div class="stat speeds">
        <div class="label" data-i18n="stat.speeds"></div>
        <div class="speed-row">
          <span class="speed" style="--c: var(--star-0)"><b id="speed-0">0</b> <span data-i18n="unit.kms"></span> <small><span id="mass-0">0</span> M☉</small></span>
          <span class="speed" style="--c: var(--star-1)"><b id="speed-1">0</b> <span data-i18n="unit.kms"></span> <small><span id="mass-1">0</span> M☉</small></span>
          <span class="speed" style="--c: var(--star-2)"><b id="speed-2">0</b> <span data-i18n="unit.kms"></span> <small><span id="mass-2">0</span> M☉</small></span>
        </div>
      </div>
    </section>
  </div>

  <button class="ui-toggle" id="btn-ui" aria-pressed="false" data-i18n-title="ui.hide">
    <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
  </button>

  <div class="lang" data-i18n-title="lang.title">
    <button data-lang="en">EN</button>
    <button data-lang="uk">УК</button>
  </div>

  <div class="masses">
    <div class="label" data-i18n="start"></div>
    <select id="preset" data-i18n-title="preset.title">
      <option value="chaos" data-note="note.chaos" data-i18n="preset.chaos"></option>
      <optgroup data-i18n-label="group.classical">
        <option value="lagrange" data-note="note.lagrange" data-i18n="preset.lagrange"></option>
        <option value="euler" data-note="note.euler" data-i18n="preset.euler"></option>
      </optgroup>
      <optgroup data-i18n-label="group.periodic">
        <option value="figure8" data-note="note.figure8" data-i18n="preset.figure8"></option>
        <option value="butterfly" data-note="note.suvakov" data-i18n="preset.butterfly"></option>
        <option value="moth" data-note="note.suvakov" data-i18n="preset.moth"></option>
        <option value="goggles" data-note="note.suvakov" data-i18n="preset.goggles"></option>
        <option value="dragonfly" data-note="note.suvakov" data-i18n="preset.dragonfly"></option>
        <option value="yinyang" data-note="note.suvakov" data-i18n="preset.yinyang"></option>
      </optgroup>
      <optgroup data-i18n-label="group.hierarchical">
        <option value="hierarchical" data-note="note.hierarchical" data-i18n="preset.hierarchical"></option>
      </optgroup>
    </select>
    <div class="note" id="preset-note"></div>
    <div class="label" data-i18n="masses"></div>
    <label style="--c: var(--star-0)" data-i18n-title="mass.title">
      <i></i>
      <input id="mass-range-0" type="range" min="0.2" max="5" step="0.05" value="1">
      <span id="mass-label-0">1.00</span> M☉
    </label>
    <label style="--c: var(--star-1)" data-i18n-title="mass.title">
      <i></i>
      <input id="mass-range-1" type="range" min="0.2" max="5" step="0.05" value="1">
      <span id="mass-label-1">1.00</span> M☉
    </label>
    <label style="--c: var(--star-2)" data-i18n-title="mass.title">
      <i></i>
      <input id="mass-range-2" type="range" min="0.2" max="5" step="0.05" value="1">
      <span id="mass-label-2">1.00</span> M☉
    </label>
    <button id="btn-random-masses" data-i18n="shuffle" data-i18n-title="shuffle.title"></button>
    <div class="label field-label" data-i18n="field"></div>
    <select id="field" data-i18n-title="field.title">
      <option value="off" data-i18n="field.off"></option>
      <option value="grid" data-i18n="field.grid"></option>
      <option value="heat" data-i18n="field.heat"></option>
    </select>
    <div class="note" data-i18n="field.note"></div>
    <label class="toggle" data-i18n-title="trails.title">
      <input id="trails" type="checkbox" checked>
      <span data-i18n="trails"></span>
    </label>
    <select id="trail-color" data-i18n-title="trailColor.title">
      <option value="speed" data-i18n="trailColor.speed"></option>
      <option value="energy" data-i18n="trailColor.energy"></option>
    </select>
    <div class="note energy-legend" id="trail-color-note" hidden>
      <span style="--c: rgb(80, 130, 255)" data-i18n="legend.bound"></span> ·
      <span style="--c: #fff" data-i18n="legend.edge"></span> ·
      <span style="--c: rgb(255, 125, 50)" data-i18n="legend.escape"></span>
    </div>
    <label class="toggle" data-i18n-title="bursts.title">
      <input id="bursts" type="checkbox" checked>
      <span data-i18n="bursts"></span>
    </label>
    <label class="toggle" data-i18n-title="waves.title">
      <input id="waves" type="checkbox" checked>
      <span data-i18n="waves"></span>
    </label>
    <label class="toggle" data-i18n-title="bloom.title">
      <input id="bloom" type="checkbox" checked>
      <span data-i18n="bloom"></span>
    </label>
  </div>

  <div class="controls">
    <span class="drag-hint" data-i18n="drag.hint"></span>
    <button id="btn-pause" data-i18n-title="pause.title"></button>
    <button id="btn-restart" data-i18n="restart" data-i18n-title="restart.title"></button>
    <button id="btn-sound" data-i18n-title="sound.title"></button>
    <label data-i18n-title="speed.title">
      <span data-i18n="speed"></span>
      <input id="speed-range" type="range" min="-2" max="2" step="0.25" value="0">
      <span id="speed-label">1×</span>
    </label>
    <button id="btn-settings" data-i18n-title="settings.button">⚙&#xFE0E;</button>
    <button id="btn-help" data-i18n-title="help.button">?</button>
  </div>

  <div class="help" id="help" hidden>
    <div class="help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <button class="help-close" id="help-close" data-i18n-title="help.close">×</button>
      <h2 id="help-title" data-i18n="help.heading"></h2>
      <p data-i18n="help.intro"></p>
      <ul>
        <li data-i18n-html="help.start"></li>
        <li data-i18n-html="help.masses"></li>
        <li data-i18n-html="help.drag"></li>
        <li data-i18n-html="help.field"></li>
        <li data-i18n-html="help.energy"></li>
      </ul>
      <h3 data-i18n="help.keys"></h3>
      <dl class="keys">
        <dt><kbd data-i18n="key.space"></kbd></dt><dd data-i18n="key.pause"></dd>
        <dt><kbd>R</kbd></dt><dd data-i18n="key.restart"></dd>
        <dt><kbd>N</kbd></dt><dd data-i18n="key.shuffle"></dd>
        <dt><kbd>M</kbd></dt><dd data-i18n="key.sound"></dd>
        <dt><kbd>G</kbd></dt><dd data-i18n="key.field"></dd>
        <dt><kbd>T</kbd></dt><dd data-i18n="key.trails"></dd>
        <dt><kbd>F</kbd></dt><dd data-i18n="key.bursts"></dd>
        <dt><kbd>W</kbd></dt><dd data-i18n="key.waves"></dd>
        <dt><kbd>B</kbd></dt><dd data-i18n="key.bloom"></dd>
        <dt><kbd>E</kbd></dt><dd data-i18n="key.trailColor"></dd>
        <dt><kbd>U</kbd></dt><dd data-i18n="key.ui"></dd>
        <dt><kbd>+</kbd> <kbd>−</kbd></dt><dd data-i18n="key.speed"></dd>
        <dt><kbd>1</kbd> … <kbd>9</kbd> <kbd>0</kbd></dt><dd data-i18n="key.presets"></dd>
        <dt><kbd>?</kbd> <kbd>H</kbd></dt><dd data-i18n="key.help"></dd>
        <dt><kbd>Esc</kbd></dt><dd data-i18n="key.close"></dd>
      </dl>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/bursts.js"></script>
  <script src="js/field.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/controls.js"></script>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
