<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The three-body problem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600&family=Syne:wght@700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="sim"></canvas>

  <div class="overlay">
    <header>
      <h1>The three-body problem.</h1>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="label">Time elapsed · years</div>
        <div class="value" id="time">0</div>
      </div>
      <div class="stat speeds">
        <div class="label">Star speeds</div>
        <div class="speed-row">
          <span class="speed" style="--c: var(--star-0)"><b id="speed-0">0</b> km/s</span>
          <span class="speed" style="--c: var(--star-1)"><b id="speed-1">0</b> km/s</span>
          <span class="speed" style="--c: var(--star-2)"><b id="speed-2">0</b> km/s</span>
        </div>
      </div>
    </section>
  </div>

  <div class="controls">
    <button id="btn-pause" title="Pause / play (Space)">Pause</button>
    <button id="btn-restart" title="New stars (R)">Restart</button>
    <button id="btn-sound" title="Sound on / off (M)">Sound: off</button>
    <label title="Time speed (− / +)">
      Speed
      <input id="speed-range" type="range" min="-2" max="2" step="0.25" value="0">
      <span id="speed-label">1×</span>
    </label>
  </div>

  <script src="audio.js"></script>
  <script src="main.js"></script>
</body>
</html>
